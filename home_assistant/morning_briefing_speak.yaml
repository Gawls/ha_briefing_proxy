alias: Morning Briefing - Speak
mode: single
fields:
  briefing_text:
    name: Briefing text
    description: "Optional text. If omitted, play the latest stored briefing."
    required: false
    selector:
      text:
        multiline: true
sequence:
  - if:
      - condition: template
        value_template: "{{ briefing_text is not defined }}"
    then:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.morning_briefing_latest

  - variables:
      text_to_speak: >-
        {%- set candidate = briefing_text if briefing_text is defined else
           (state_attr('sensor.morning_briefing_latest', 'text')
            if has_value('sensor.morning_briefing_latest') else none) -%}
        {{ candidate | trim if candidate is string else '' }}

  - if:
      - condition: template
        value_template: "{{ text_to_speak | length == 0 }}"
    then:
      - action: persistent_notification.create
        data:
          title: "Morning Briefing: Nothing to speak"
          message: "No valid briefing text was supplied or available from the proxy."
      - stop: "No briefing text is available."
        error: true

  - action: tts.speak
    target:
      entity_id: tts.elevenlabs_custom_tts
    data:
      media_player_entity_id: media_player.living_room_speaker
      message: "{{ text_to_speak }}"
      cache: true
      options:
        voice_profile: "Test1"
